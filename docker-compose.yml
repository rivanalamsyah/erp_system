version: "3.9"

services:
  db:
    image: postgres:17-alpine
    container_name: erp-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_erp}
      POSTGRES_USER: ${POSTGRES_USER:-erp_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-P@ssw0rdEnterprise2026!}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp_admin} -d ${POSTGRES_DB:-enterprise_erp}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - erp-network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-enterprise_erp};Username=${POSTGRES_USER:-erp_admin};Password=${POSTGRES_PASSWORD:-P@ssw0rdEnterprise2026!};Maximum Pool Size=100;
    volumes:
      - erp_uploads:/app/uploads
      - erp_logs:/app/logs
    networks:
      - erp-network

volumes:
  postgres_data:
    name: erp_postgres_data
  erp_uploads:
    name: erp_app_uploads
  erp_logs:
    name: erp_app_logs

networks:
  erp-network:
    name: erp_internal_network
    driver: bridge
